<mat-toolbar>
  <div class="flex-center-between default-wrapper">
    <div class="flex-center-between gap-2">
      <div class="flex-center-between gap-2">
        <img
          [src]="'logo.png'"
          alt="Librify Logo"
          class="w-8 h-8 sm:w-10 sm:h-10 md:w-14 md:h-14" />
        <span class="text-lg md:text-xl font-medium">Librify</span>
      </div>
    </div>

    <div>
      <button mat-button routerLink="/login">Login</button>
    </div>

    <div>
      <button mat-icon-button [matMenuTriggerFor]="themeMenu">
        <mat-icon>{{ themeService.selectedTheme()?.icon }}</mat-icon>
      </button>

      <mat-menu #themeMenu="matMenu">
        @for (theme of themeService.getThemes(); track theme.name) {
          <button
            [class.selected-theme]="
              themeService.selectedTheme()?.name === theme.name
            "
            mat-menu-item
            (click)="themeService.setTheme(theme.name)">
            <mat-icon>{{ theme.icon }}</mat-icon>
            <span>{{ theme.name | titlecase }}</span>
          </button>
        }
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
