<div
  class="h-[calc(100vh-64px)] lg:h-screen p-4 flex justify-center items-center bg-body-secondary-light dark:bg-body-secondary-dark">
  <div
    class="rounded-md p-6 w-full max-w-xl shadow-md bg-body-primary-light dark:bg-body-primary-dark">
    <h2 class="text-base lg:text-lg font-medium mb-4">Change password</h2>
    <form>
      <mat-form-field class="auth-form-field">
        <mat-label>Current Password</mat-label>
        <input matInput type="password" />
        <mat-icon matSuffix>visibility_off</mat-icon>
      </mat-form-field>

      <mat-form-field class="auth-form-field">
        <mat-label>New Password</mat-label>
        <input matInput type="password" />
        <mat-icon matSuffix>visibility_off</mat-icon>
      </mat-form-field>

      <mat-form-field class="auth-form-field">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" />
        <mat-icon matSuffix>visibility_off</mat-icon>
      </mat-form-field>
    </form>

    <div class="flex justify-end">
      <button mat-flat-button type="submit">
        <mat-icon>lock</mat-icon> <span>Change Password</span>
      </button>
    </div>
  </div>
</div>
