<div class="profile-container">
  <div class="profile-section">
    <div class="profile-header">
      <img src="logo.png" alt="User Photo" class="profile-avatar" />
      <div class="profile-info">
        <h1 class="profile-info-name">Bayzed Meer</h1>
        <p>123456789</p>
        <p class="flex items-center gap-1">
          <span>Premium</span>
          <app-rating-stars />
        </p>
      </div>

      <div class="flex flex-col md:flex-row gap-2 md:gap-4">
        <button mat-flat-button>
          <mat-icon>cloud_upload</mat-icon> <span>Upload</span>
        </button>
        <button mat-flat-button>
          <mat-icon>delete</mat-icon> <span>Delete</span>
        </button>
      </div>
    </div>
  </div>

  <hr class="profile-divider" />

  <div class="profile-section">
    <h2 class="profile-section-title">Personal Details</h2>
    <form [formGroup]="profileForm" class="profile-form-grid">
      <mat-form-field class="auth-form-field">
        <mat-label>First Name</mat-label>
        <mat-icon matSuffix>person</mat-icon>
        <input matInput type="text" formControlName="firstName" />
      </mat-form-field>

      <mat-form-field class="auth-form-field">
        <mat-label>Last Name</mat-label>
        <mat-icon matSuffix>person</mat-icon>
        <input matInput type="text" formControlName="lastName" />
      </mat-form-field>

      <mat-form-field class="auth-form-field">
        <mat-label>Email</mat-label>
        <mat-icon matSuffix>email</mat-icon>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field class="auth-form-field">
        <mat-label>Phone</mat-label>
        <mat-icon matSuffix>phone</mat-icon>
        <input matInput type="tel" formControlName="phone" />
      </mat-form-field>

      <mat-form-field class="auth-form-field">
        <mat-label>Gender</mat-label>
        <mat-select formControlName="gender">
          <mat-option value="male">Male</mat-option>
          <mat-option value="female">Female</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="auth-form-field">
        <mat-label>Birth Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="birthDate" />
        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker touchUi #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="col-span-full auth-form-field">
        <mat-label>Location</mat-label>
        <textarea matInput rows="6" formControlName="location"></textarea>
      </mat-form-field>
    </form>

    <div class="flex justify-end">
      <button mat-flat-button>
        <mat-icon>save</mat-icon> <span>Save</span>
      </button>
    </div>
  </div>
</div>
