<div
  class="flex flex-col h-[calc(100vh-52px)] lg:h-screen bg-body-secondary-light dark:bg-body-secondary-dark">
  <!-- Header -->
  <header
    class="bg-body-primary-light dark:bg-body-primary-dark p-4 flex items-center justify-between">
    <h2 class="text-lg font-medium text-title-light dark:text-title-dark">
      Chat with Librarian
    </h2>
    <mat-icon>chat</mat-icon>
  </header>

  <!-- Chat Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">
    <!-- Librarian Message -->
    <div class="flex items-start space-x-2">
      <img class="w-8 h-8 rounded-full" src="logo.png" alt="Librarian" />
      <div
        class="bg-card-light dark:bg-card-dark text-text-light dark:text-text-dark shadow-md p-3 max-w-xs rounded-md">
        <p class="text-sm">Hello! How can I help you?</p>
        <span class="text-xs text-gray-400 block text-right mt-1"
          >10:30 AM</span
        >
      </div>
    </div>

    <!-- User Message -->
    <div class="flex items-start space-x-2 justify-end">
      <div
        class="bg-card-light dark:bg-card-dark text-text-light dark:text-text-dark p-3 max-w-xs rounded-md">
        <p class="text-sm">I need help finding a book.</p>
        <span class="text-xs text-gray-200 block text-right mt-1"
          >10:31 AM</span
        >
      </div>
      <img class="w-8 h-8 rounded-full" src="logo.png" alt="User" />
    </div>
  </div>

  <!-- Message Input -->
  <div
    class="bg-body-primary-light dark:bg-body-primary-dark p-3 flex items-center">
    <mat-form-field class="flex-1" appearance="outline">
      <mat-label>Type a message...</mat-label>
      <input matInput />
    </mat-form-field>
    <button mat-icon-button color="primary">
      <mat-icon>send</mat-icon>
    </button>
  </div>
</div>
