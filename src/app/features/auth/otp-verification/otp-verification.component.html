<div
  class="flex-center-col min-w-full min-h-full bg-body-light dark:bg-body-dark">
  <div class="flex-center mt-4 md:mt-0">
    <img src="logo.png" alt="logo" class="w-12 md:w-16 h-12 md:h-16 mx-auto" />
    <p
      class="text-base md:text-xl font-medium text-heading-light dark:text-heading-dark">
      Librify
    </p>
  </div>
  <div
    class="bg-container-light dark:bg-container-dark w-[85%] md:w-[60%] lg:w-[40%] xl:w-[30%] p-6 md:p-8 mb-6 md:mb-0 rounded-lg">
    <p
      class="text-base md:text-xl font-medium text-heading-light dark:text-heading-dark mb-2">
      Verify your OTP
    </p>
    <p class="text-xs md:text-sm text-label-light dark:text-label-dark pb-4">
      Please enter the one-time password (OTP) sent to your email address to
      verify your account and continue to reset password.
    </p>
    <form>
      <mat-form-field class="form-field">
        <mat-label>OTP</mat-label>
        <input matInput type="text" />
        <mat-icon matSuffix>vpn_key</mat-icon>
      </mat-form-field>

      <button mat-flat-button type="submit">Verify OTP</button>

      <div
        class="text-xs md:text-sm text-label-light dark:text-label-dark mt-4">
        Didn't receive the code?
        <span
          class="text-primary-light dark:text-primary-dark font-medium cursor-pointer">
          Resend OTP
        </span>
      </div>
    </form>
  </div>
</div>
