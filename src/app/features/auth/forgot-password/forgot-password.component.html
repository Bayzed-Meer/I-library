<div class="auth-container">
  <div class="auth-logo-wrapper">
    <img src="logo.png" alt="logo" class="auth-logo-icon" />
    <h1 class="auth-logo-text">Librify</h1>
  </div>
  <div class="auth-form-wrapper">
    <div class="auth-form-left-container">
      <div class="auth-form-left">
        <h1 class="auth-form-title">Forgot your password?</h1>
        <p class="auth-form-subtitle">
          Enter your email below to receive a password reset code.
        </p>
        <form>
          <mat-form-field class="auth-form-field">
            <mat-label>Email</mat-label>
            <input matInput type="email" />
            <mat-icon matSuffix>email</mat-icon>
          </mat-form-field>

          <button mat-flat-button type="submit" class="w-full">
            <mat-icon>send</mat-icon>
            Send Verification Code
          </button>

          <p class="auth-form-suggestion">
            Don't have an account?
            <a routerLink="/register" class="auth-form-suggestion-link"
              >Register</a
            >
          </p>
        </form>
      </div>
    </div>

    <div class="auth-form-right-container">
      <div class="auth-form-right">
        <img
          src="{{
            appTheme() === 'dark' ? 'forgot-dark.png' : 'forgot-light.png'
          }}"
          alt="forgot-image"
          class="auth-form-right-image" />
      </div>
    </div>
  </div>
</div>
